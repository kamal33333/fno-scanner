name: Nifty 500 Confluence Swing Scanner (BB55 + CMF + EMA)

on:
  schedule:
    # 03:18 PM IST (09:48 UTC), Monday to Friday - Live Closing Bell Execution
    - cron: '48 9 * * 1-5'
    # 04:05 PM IST (10:35 UTC), Monday to Friday - Post-Market GTT Order Planning
    - cron: '35 10 * * 1-5'
  workflow_dispatch: # Allows manual 1-click trigger anytime from GitHub Actions tab

jobs:
  run-confluence-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Confluence Swing Scanner & 5Y Strategy Comparison
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python confluence_swing_scanner.py
