name: F&O Options Scanner v3

on:
  schedule:
    # Runs ~2 min after each 15m NSE bar closes (IST = UTC+5:30), Mon-Fri.
    # 03:02-10:47 UTC = 08:32-16:17 IST; the script itself exits outside 09:15-15:35 IST.
    - cron: "2,17,32,47 3-10 * * 1-5"
  workflow_dispatch:      # manual run from the Actions tab (always sends a full report)

# Never let two runs overlap - they share the state file (de-dup + open-signal tracking).
concurrency:
  group: fno-scanner-v3
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-v2.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-v2.txt

      # State (sent-alert de-dup + open-signal lifecycle) survives between runs via the Actions cache.
      - name: Restore scanner state
        uses: actions/cache/restore@v4
        with:
          path: scanner_state_v3.json
          key: fno-v3-state-${{ github.run_id }}
          restore-keys: |
            fno-v3-state-

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          SCANNER_STATE_FILE: scanner_state_v3.json
          # ---- optional tuning (defaults shown in the script; uncomment to override) ----
          # RISK_PER_TRADE: "3000"
          # MAX_CAPITAL_PER_TRADE: "45000"
          # TOP_N_STOCKS: "10"
          # FDR_Q: "0.25"
          # MIN_NET_R: "0.05"
          # STT_OPT_SELL: "0.0015"
          # NSE_EXPIRY_WEEKDAY: "1"
          # NSE_HOLIDAYS: "2026-11-09,2026-11-24"
          # SKIP_SYMBOLS: "ANGELONE,NYKAA"
        run: python options_scannerv3.py

      - name: Save scanner state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scanner_state_v3.json
          key: fno-v3-state-${{ github.run_id }}
