name: Nifty 500 5Y Swing Scanner (swing_scanner)

on:
  schedule:
    # 04:15 UTC = 09:45 AM IST (Post-Open Swing Scan)
    - cron: '15 4-9 * * 1-5'
    # 10:05 UTC = 03:35 PM IST (End-of-Day Positional GTT Closing Scan)
    - cron: '5 10 * * 1-5'
  workflow_dispatch:

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy scipy requests pytz

      - name: Run Cash Swing & Intraday Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python swing_scanner.py
